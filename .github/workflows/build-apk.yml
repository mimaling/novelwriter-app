name: Build APK
 on:
   workflow_dispatch:
   push:
     branches: [ main ]
 jobs:
   build:
     runs-on: ubuntu-latest
     steps:
       - name: 检出仓库
         uses: actions/checkout@v4
       - name: 安装 JDK 17
         uses: actions/setup-java@v4
         with:
           distribution: temurin
           java-version: 17
       - name: 解压工程源码
         shell: bash
         run: |
           if ls *.zip >/dev/null 2>&1; then
             unzip -q -o *.zip
           fi
           PROJ_DIR=$(find . -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -1)
           if [ -z "$PROJ_DIR" ]; then
             echo "::error::未找到 settings.gradle.kts"
             exit 1
           fi
           echo "PROJ_DIR=$PROJ_DIR" >> "$GITHUB_ENV"
       - name: 安装 Gradle 8.5
         uses: gradle/actions/setup-gradle@v3
         with:
           gradle-version: "8.5"
       - name: 构建 Debug APK
         shell: bash
         run: |
           cd "$PROJ_DIR"
           gradle assembleDebug --no-daemon
       - name: 上传 APK 产物
         uses: actions/upload-artifact@v4
         with:
           name: app-debug-apk
           path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
           if-no-files-found: error
